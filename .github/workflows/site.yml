# The documentation site: README.md, docs/ and the tools' READMEs, rendered
# by EmbCC's own embdoc (tools/embdoc) and published with GitHub Pages.
# A broken relative link or #anchor fails the build, and nothing is
# published. Locally: `make site` writes the same pages to build/site.
name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push waits rather than cancelling one
# that is half published
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build embdoc
        run: make embdoc
      - name: Check every link and anchor
        run: ./embdoc check
      - name: Render the site
        run: ./embdoc site --out _site --base-url /EmbCC/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
